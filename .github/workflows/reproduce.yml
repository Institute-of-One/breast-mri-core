name: reproduce

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reproduce:
    name: Supplementary Data S1 is intact and reproduces the reported AUCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the pinned environment
        run: python -m pip install -r requirements.lock.txt
      - name: Every file matches sha256.json
        working-directory: supplementary_data_s1
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path("sha256.json").read_text(encoding="utf-8"))
          # sha256.json was written on Windows and records paths with backslashes; it is
          # part of S1 and stays as written, so the separators are normalised here.
          bad = [p for p, h in manifest.items()
                 if hashlib.sha256(pathlib.Path(p.replace("\\", "/")).read_bytes()).hexdigest() != h]
          assert not bad, f"checksum mismatch: {bad}"
          print(f"{len(manifest)} files match sha256.json")
          PY
      - name: Reproduce all 20 AUC comparisons and intervals
        working-directory: supplementary_data_s1
        run: python reproduce_auc.py
      - name: Pair decomposition reproduces the committed result
        run: |
          cp analysis/rank_mechanism.json /tmp/committed.json
          python analysis/rank_mechanism.py
          python - <<'PY'
          import json, math
          a = json.load(open("/tmp/committed.json")); b = json.load(open("analysis/rank_mechanism.json"))
          def same(x, y, path="$"):
              if isinstance(x, dict):
                  assert x.keys() == y.keys(), path
                  for k in x: same(x[k], y[k], f"{path}.{k}")
              elif isinstance(x, float) or isinstance(y, float):
                  assert math.isclose(x, y, rel_tol=0, abs_tol=1e-12), (path, x, y)
              else:
                  assert x == y, (path, x, y)
          same(a, b)
          print("analysis/rank_mechanism.json reproduced to within 1e-12")
          PY
