name: revision

# The reproduce workflow checks Supplementary Data S1 and the pair
# decomposition, which is what the first version of the manuscript rested on.
# This one checks the work added at revision, and it checks it the only way
# that means anything: the committed results are deleted first and rebuilt
# from the committed code, so a step that quietly stops writing a file fails
# instead of comparing that file with itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revision:
    name: The revision's tests pass and its results regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the pinned environment
        run: python -m pip install -r requirements.lock.txt

      # Three suites. test_crossval holds the counterexamples that found the
      # leave-one-out defect; test_early_only plants the defects the
      # containment measurement exists to catch; test_early_only_injection
      # breaks the module on purpose and fails if those tests stay green.
      - name: Tests
        working-directory: analysis
        run: python -m unittest test_crossval test_early_only test_early_only_injection -v

      - name: The frozen plans are unchanged since they were frozen
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "analysis")
          import theme4_early_only as m
          lock = m.require_freeze()
          print("plan  ", lock["plan_sha256"])
          print("script", lock["script_sha256"])
          PY

      # Delete, rebuild, compare. A result the build no longer writes is a
      # missing file, not a file that matches itself.
      #
      # The comparison is numeric, not byte-for-byte. The committed results
      # were produced on Windows and this runner is Ubuntu, and the logistic
      # fits land on different last bits through a different BLAS: the first
      # push of this workflow failed on differences at the fifteenth
      # significant digit, such as 1.0803138193249566 against
      # 1.0803138193249424. The manuscript quotes these to three or four
      # decimals, so a tolerance of 1e-9 relative is still some six orders of
      # magnitude tighter than anything reported, while last-bit noise is
      # around 1e-14. Structure and every non-numeric value must match
      # exactly, so a renamed key or a changed label still fails.
      - name: The revision's results regenerate from the committed code
        run: |
          mkdir -p /tmp/committed
          cp data/derived/theme4_revision_v1/*.json /tmp/committed/
          rm -f data/derived/theme4_revision_v1/rank_preservation.json \
                data/derived/theme4_revision_v1/reproduction_tolerance.json \
                data/derived/theme4_revision_v1/strata.json \
                data/derived/theme4_revision_v1/subtype_adjusted.json \
                data/derived/theme4_revision_v1/clinical_utility.json
          python analysis/theme4_rank_preservation.py
          python analysis/theme4_reproduction_tolerance.py
          python analysis/theme4_strata.py
          python analysis/theme4_subtype_adjusted.py
          python analysis/theme4_clinical_utility.py
          python - <<'PY'
          import json, math, pathlib, sys

          REBUILT = ["rank_preservation", "reproduction_tolerance", "strata",
                     "subtype_adjusted", "clinical_utility"]

          def same(a, b, path="$"):
              if isinstance(a, dict):
                  assert isinstance(b, dict) and a.keys() == b.keys(), path
                  for k in a:
                      same(a[k], b[k], f"{path}.{k}")
              elif isinstance(a, list):
                  assert isinstance(b, list) and len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)):
                      same(x, y, f"{path}[{i}]")
              elif isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b)
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          for name in REBUILT:
              now = pathlib.Path(f"data/derived/theme4_revision_v1/{name}.json")
              assert now.exists(), f"{name}.json was not rebuilt"
              was = pathlib.Path(f"/tmp/committed/{name}.json")
              same(json.loads(was.read_text()), json.loads(now.read_text()), name)
              print(f"{name}.json reproduced")
          print(f"{len(REBUILT)} result files reproduced from the committed code")
          PY

      # The support experiment and the validation read the images, which are
      # not redistributed, so they cannot run here. Their code, their frozen
      # plans and their results are in the repository; this step only checks
      # that the modules import, because an archive whose code cannot be
      # imported is not an archive.
      - name: The image-dependent modules import
        working-directory: analysis
        run: python -c "import theme4_early_only, theme4_validation_analyse, freeze_validation_plan; print('ok')"
